name: Refresh AKShare market evidence

on:
  workflow_dispatch:
  schedule:
    # One daily baseline: 08:35 Asia/Shanghai, Monday-Friday.
    - cron: "35 0 * * 1-5"

permissions:
  contents: write

concurrency:
  group: akshare-market-evidence
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch market evidence
        run: python scripts/fetch_akshare_snapshot.py --output data/akshare-latest.json

      - name: Validate evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path("data/akshare-latest.json").read_text())
          assert evidence["schemaVersion"] == 2
          assert evidence["status"] in {"ok", "partial"}
          for market in ("A", "HK"):
              item = evidence["markets"][market]
              assert item["status"] == "ok"
              assert item["marketPhase"] in {
                  "previous_close_baseline", "intraday_snapshot", "latest_close"
              }
              assert item["representative"]
          PY

      - name: Publish changed evidence
        run: |
          if git diff --quiet -- data/akshare-latest.json; then
            echo "No evidence change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/akshare-latest.json
          git commit -m "Refresh AKShare market evidence"
          git pull --rebase origin main
          git push origin HEAD:main
